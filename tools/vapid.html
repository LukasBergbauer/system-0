<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAPID-Schlüssel erzeugen</title>
<style>
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 16px; color: #2B1E19; background: #FBF4EF; }
  textarea { width: 100%; height: 220px; font: 13px ui-monospace, monospace; padding: 12px; border-radius: 12px; border: 1px solid #ddd; }
  button { font: inherit; padding: 10px 18px; border-radius: 999px; border: 0; background: #21170F; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<h1>VAPID-Schlüssel für Mitteilungen</h1>
<p>Einmalig. Läuft nur hier im Browser, nichts wird gesendet oder gespeichert.
Den Text unten komplett kopieren und in Supabase → Edge Functions → Secrets als <b>VAPID_KEYS</b> eintragen.
Nicht ins Repo legen.</p>
<p><button id="los" type="button">Erzeugen</button></p>
<textarea id="aus" readonly></textarea>
<script type="module">
  document.getElementById('los').onclick = async () => {
    const keys = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
    const json = {
      publicKey: await crypto.subtle.exportKey('jwk', keys.publicKey),
      privateKey: await crypto.subtle.exportKey('jwk', keys.privateKey),
    };
    document.getElementById('aus').value = JSON.stringify(json);
  };
</script>
</body>
</html>
