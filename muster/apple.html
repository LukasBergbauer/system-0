<!doctype html>
<!-- Muster „Apple-Feinschliff“ der To-dos. Öffnen: http://127.0.0.1:8000/muster/apple.html -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Muster Apple</title>
  <link rel="stylesheet" href="../src/styles/tokens.css">
  <link rel="stylesheet" href="../src/styles/base.css">
  <link rel="stylesheet" href="../src/styles/components.css">
  <link rel="stylesheet" href="../src/styles/akzent-neutral.css">
  <link rel="stylesheet" href="apple.css">
</head>
<body>
<main class="m" id="m"></main>
<script type="module">
  import { symbol } from '../src/ui/symbol.js';
  import { akzentLaden } from '../src/core/akzent.js';
  akzentLaden();
  const z = (titel, { sub = '', prio = 0, warn = false, fertig = false } = {}) => `<div class="z${fertig ? ' z--fertig' : ''}"><i class="ring${fertig ? ' an' : ''}"></i>
    <div class="z__text"><div class="z__titel">${prio ? `<em>${'!'.repeat(prio)}</em>` : ''}${titel}</div>${sub ? `<div class="z__sub${warn ? '' : ''}">${warn ? `<span class="warn">${sub}</span>` : sub}</div>` : ''}</div></div>`;
  const gruppe = (titel, zeilen, zahl) => `<section><div class="gruppe__titel"><b>${titel}</b><span>${zahl}</span></div><div class="karte">${zeilen}</div></section>`;
  const nachher = `<div class="tel">
    <header class="kopf"><h1><small>ALLTAG</small>To-dos</h1><div style="text-align:right"><b>6</b><br><span>offen</span></div></header>
    <div class="zeile-oben"><div class="seg"><span class="an">Alle</span><span>Privat</span><span>Uni</span><span>Büro</span></div><span class="textknopf">Bearbeiten</span></div>
    <div><div class="feld"><span>Neues To-do</span><i>${symbol('plus').outerHTML}</i></div>
      <div class="optionen"><span class="opt an">Heute</span><span class="opt">Morgen</span><span class="opt">! Priorität</span></div></div>
    ${gruppe('Heute', z('Physio-Skript Kapitel 4', { prio: 2, sub: 'Uni' }) + z('Einkaufen', { sub: 'Privat' }), 2)}
    ${gruppe('Morgen', z('Steuer abgeben', { prio: 1, sub: 'Büro' }), 1)}
    ${gruppe('Nicht erledigt', z('Rechnung bezahlen', { sub: 'Gestern · Privat', warn: true }), 1)}
    <section><div class="karte"><div class="mehr"><span>Erledigt anzeigen</span><span style="color:var(--text-3)">12 ›</span></div></div></section>
  </div>`;
  document.getElementById('m').innerHTML = `<div class="spalte"><h2>To-dos – Apple-Feinschliff (Design wie bisher, nur ruhiger)</h2>${nachher}</div>
    <div class="spalte" style="max-width:340px"><h2>Was sich ändert</h2><ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.7;color:var(--text-2)">
      <li>Farbkopf, Glas, Akzentfarbe bleiben</li>
      <li>Bereichs-Filter als iOS-Segment (grau, weißer Daumen) statt Kapseln; „Bearbeiten“ als Textknopf</li>
      <li>Eingabefeld rund wie iOS, „+“ als Akzent-Kreis</li>
      <li>Gruppen-Titel klein über der Karte (wie Einstellungen am iPhone), kein Glas-Kasten mehr</li>
      <li>Zeilen 48 px, Trennlinie eingerückt, runder Haken, Priorität als „!!“ vor dem Titel wie in Erinnerungen</li>
      <li>Datum/Bereich grau darunter, Überfälliges rot</li>
      <li>„Erledigt anzeigen“ als eigene Zeile</li></ul></div>`;
</script>
</body>
</html>
