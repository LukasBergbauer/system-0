<!doctype html>
<!-- Muster: Seiten klar erkennbar, eine Hauptaktion, weniger lose Blöcke. Öffnen: http://127.0.0.1:8000/muster/seiten.html -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Muster Seiten</title>
  <link rel="stylesheet" href="../src/styles/tokens.css">
  <link rel="stylesheet" href="../src/styles/base.css">
  <link rel="stylesheet" href="../src/styles/components.css">
  <link rel="stylesheet" href="../src/styles/akzent-neutral.css">
  <link rel="stylesheet" href="seiten.css">
</head>
<body>
<main class="m" id="m"></main>
<script type="module">
  import { symbol } from '../src/ui/symbol.js';
  import { akzentLaden } from '../src/core/akzent.js';
  akzentLaden();
  const s = (n) => symbol(n).outerHTML;
  const SEITEN = [
    { id: 'todos', titel: 'To-dos', abschnitt: 'Alltag', haupt: 'To-do', wert: ['3', 'offen'],
      teile: [['Heute', ['Physio-Skript lesen', 'Einkaufen']], ['Morgen', ['Steuer abgeben']]], neben: ['Nicht erledigt', '1 von gestern'] },
    { id: 'training', titel: 'Training', abschnitt: 'Körper & Kopf', haupt: 'Starten', wert: ['5', 'Wochen in Folge'],
      teile: [['Heute', ['Ganzkörper A · 45 min']], ['Plan', ['Mi · Laufen locker', 'Fr · Mobilität']]], neben: ['Diese Woche', '3 von 4'] },
  ];
  const zeilen = (liste, id) => liste.map((t) => `<div class="zeile">${id === 'todos' ? '<i class="haken"></i>' : s('training')}<span>${t}</span></div>`).join('');
  const knopf = (p) => `<button class="haupt">${s('plus')}${p.haupt}</button>`;
  const ico = (n) => `<button class="ico" aria-label="${n}">${s(n)}</button>`;

  const A = (p) => `<div class="a"><div class="a__wz">${s(p.id)}</div>
    <div class="a__kopf"><h1><small class="lab">${p.abschnitt}</small>${p.titel}</h1>${ico('suche')}${knopf(p)}</div>
    <div class="a__raum glas">${p.teile.map(([t, l]) => `<div class="a__teil"><span class="lab">${t}</span>${zeilen(l, p.id)}</div>`).join('')}
      <div class="a__teil klein">${p.neben[0]} · ${p.neben[1]}</div></div></div>`;

  const B = (p) => `<div class="m-${p.id}"><div class="b__band"><div><span class="lab">${p.abschnitt}</span><h1>${p.titel}</h1></div>
      <div class="b__wert"><div class="zahl">${p.wert[0]}</div><div class="klein">${p.wert[1]}</div></div></div>
    <div class="b__bento">${p.teile.map(([t, l], i) => `<div class="b__feld"><span class="lab">${t}</span>${zeilen(l, p.id)}</div>`).join('')}
      <div class="b__feld b__feld--breit" style="display:flex;align-items:center;gap:var(--space-3)"><span class="klein" style="flex:1">${p.neben[0]} · ${p.neben[1]}</span>${knopf(p)}</div></div></div>`;

  const C = (p) => `<div><div class="c__reiter glas"><span class="plaett">${s(p.id)}</span><h1>${p.titel}</h1></div>
    <div class="c__blatt glas"><div class="c__leiste"><span class="klein"><b>${p.wert[0]}</b> ${p.wert[1]}</span>${ico('suche')}${knopf(p)}</div>
      ${p.teile.map(([t, l]) => `<div class="c__teil"><span class="lab">${t}</span>${zeilen(l, p.id)}</div>`).join('')}</div></div>`;

  const VARIANTEN = [
    ['A · Bühne', 'Titel groß und frei auf dem Hintergrund, großes Bereichs-Symbol als Wasserzeichen. Alles darunter ist EINE Glasfläche mit Abschnitten statt vieler Kästen. Eine dunkle Hauptaktion, Rest als Symbol.', A],
    ['B · Farbiger Kopf + Bento', 'Jede Seite hat oben ein Farb-Band mit eigenem Muster und einer Kennzahl. Darunter hängen die Felder lückenlos zusammen (Bento) – wirkt wie ein Stück, nicht reingeklatscht.', B],
    ['C · Ordner-Reiter', 'Die Seite ist ein Blatt mit Reiter (Symbol im Akzent + Titel). Werkzeuge in einer Leiste oben im Blatt, Inhalt in Abschnitten. Ort erkennt man am Reiter, Ruhe durch nur eine Fläche.', C],
  ];
  document.getElementById('m').innerHTML = VARIANTEN.map(([t, txt, f]) =>
    `<section><h2>${t}</h2><p>${txt}</p><div class="paar">${SEITEN.map(f).join('')}</div></section>`).join('');
</script>
</body>
</html>
