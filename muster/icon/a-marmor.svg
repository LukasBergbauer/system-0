<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Variante A: helle Marmor-Null mit zarten grauen Adern, leicht erhaben, auf weißem Schimmer -->
  <defs>
    <radialGradient id="grund" cx="28%" cy="20%" r="100%">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#F6F5F2"/><stop offset="1" stop-color="#E8E7E3"/>
    </radialGradient>
    <linearGradient id="schimmer" x1="0" y1="0" x2="1" y2="1">
      <stop offset=".22" stop-color="#fff" stop-opacity="0"/><stop offset=".44" stop-color="#fff" stop-opacity=".8"/>
      <stop offset=".54" stop-color="#EFEDF1" stop-opacity=".35"/><stop offset=".76" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="stein" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .018" numOctaves="5" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer result="adern">
        <feFuncR type="table" tableValues="1 1 1 1 1 1 .97 .86 .72 .86 .97 1 1 1 1 1 1"/><feFuncG type="table" tableValues="1 1 1 1 1 1 .97 .86 .72 .86 .97 1 1 1 1 1 1"/>
        <feFuncB type="table" tableValues="1 1 1 1 1 1 .97 .86 .72 .86 .97 1 1 1 1 1 1"/><feFuncA type="linear" slope="0" intercept="1"/>
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/>
      <feColorMatrix type="matrix" values=".16 0 0 0 .86  .16 0 0 0 .86  .16 0 0 0 .86  0 0 0 0 1" result="korn"/>
      <feBlend in="SourceGraphic" in2="adern" mode="multiply"/><feBlend in2="korn" mode="multiply"/>
      <feComposite in2="SourceAlpha" operator="in" result="stein"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="weich"/>
      <feSpecularLighting in="weich" surfaceScale="5" specularConstant=".7" specularExponent="18" lighting-color="#fff">
        <feDistantLight azimuth="235" elevation="48"/>
      </feSpecularLighting>
      <feComposite in2="SourceAlpha" operator="in" result="glanz"/>
      <feComposite in="stein" in2="glanz" operator="arithmetic" k2="1" k3=".55" result="hell"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dy="16"/><feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feColorMatrix type="matrix" values="0 0 0 0 .23  0 0 0 0 .2  0 0 0 0 .18  0 0 0 1 0" result="weit"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="3"/><feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
      <feColorMatrix type="matrix" values="0 0 0 0 .2  0 0 0 0 .18  0 0 0 0 .16  0 0 0 1 0" result="nah"/>
      <feMerge><feMergeNode in="weit"/><feMergeNode in="nah"/><feMergeNode in="hell"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#grund)"/>
  <path filter="url(#stein)" fill="#EFEDE9" fill-rule="evenodd"
        d="M140 256A116 156 0 1 0 372 256A116 156 0 1 0 140 256ZM192 256A64 108 0 1 1 320 256A64 108 0 1 1 192 256Z"/>
  <rect width="512" height="512" fill="url(#schimmer)" opacity=".55"/>
</svg>
