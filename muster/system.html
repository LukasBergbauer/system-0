<!doctype html>
<!-- Muster „Ein System“: gleiche Abstände, Schriften, Rundungen; Knöpfe verschmelzen mit Leisten. Öffnen: http://127.0.0.1:8000/muster/system.html -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Muster System</title>
  <link rel="stylesheet" href="../src/styles/tokens.css">
  <link rel="stylesheet" href="../src/styles/base.css">
  <link rel="stylesheet" href="../src/styles/components.css">
  <link rel="stylesheet" href="../src/styles/akzent-neutral.css">
  <link rel="stylesheet" href="system.css">
</head>
<body>
<main class="m" id="m"></main>
<script type="module">
  import { symbol } from '../src/ui/symbol.js';
  import { akzentLaden } from '../src/core/akzent.js';
  akzentLaden();
  const s = (n) => symbol(n).outerHTML;
  const kopf = (titel, zahl, text) => `<header class="kopf"><div class="r-titel"><span class="r-label">${titel === 'To-dos' ? 'Alltag' : 'Körper & Kopf'}</span>${titel}</div>
    <div style="text-align:right"><b>${zahl}</b><div style="font-size:var(--fs-small);opacity:.8">${text}</div></div></header>`;
  const zeilen = (l) => l.map((t) => `<div class="zeile"><i class="haken"></i><span class="r-text">${t}</span></div>`).join('');
  const segmente = `<div class="segmente glas"><span class="an">Alle</span><span>Arbeit</span><span>Privat</span></div>`;
  const eingabe = (knopf) => `<div class="leiste glas"><input placeholder="Neues To-do …">${knopf}</div>`;
  const plusKnopf = `<button class="leiste__knopf" aria-label="Hinzufügen">${s('plus')}</button>`;
  const feld = (label, inhalt, { aktion = '', fuss = '' } = {}) => `<section class="feld glas${fuss ? ' feld--fuss' : ''}">
    <div class="feld__kopf"><span class="r-label">${label}</span>${aktion}</div>${inhalt}${fuss ? `<div class="feld__fuss">${fuss}</div>` : ''}</section>`;
  const ico = (n, label) => `<span class="ico" aria-label="${label}">${s(n)}</span>`;

  let zufall = 7;
  const rnd = () => ((zufall = (zufall * 9301 + 49297) % 233280) / 233280);
  const mini = () => `<div class="mini">${Array.from({ length: 7 * 26 }, (_, i) => `<i class="${i > 60 ? (rnd() < .45 ? 'an' : rnd() < .3 ? 'halb' : '') : ''}"></i>`).join('')}</div>`;
  const gew = (name, summe, farbe, serie, fertig) => `<div style="--g:var(--gew-${farbe});display:flex;flex-direction:column;gap:var(--space-3)">
    <div class="feld__kopf"><div style="flex:1"><div class="r-text" style="font-weight:600">${name}</div><div class="r-meta">${summe}</div></div>
    <div class="split"><span>${fertig ? '✓' : '○'} Heute</span><span>${s('flamme')}${serie}</span></div></div>${mini()}</div>`;
  const gewohnheiten = gew('Lesen', '124 Tage', 1, 4, true) + '<div style="border-top:var(--glas-kante) solid var(--line)"></div>' + gew('Klavier', '32 h 30 min', 3, 0, false);

  const VARIANTEN = [
    ['v-a', 'A · Ruhig & luftig', 'Abstände 24 px zwischen Feldern, 24 px innen, Leisten 48 px mit 16 px Rundung. Hauptknopf sitzt als dunkles Quadrat IN der Eingabeleiste, Filter als ein Segment-Balken. Nebenaktionen nur als kleines Symbol im Feldkopf.',
      () => [kopf('To-dos', 3, 'offen'), segmente, eingabe(plusKnopf), feld('Heute', zeilen(['Physio-Skript lesen', 'Einkaufen']), { aktion: ico('mehr', 'Mehr') }), feld('Morgen', zeilen(['Steuer abgeben']))],
      () => [kopf('Gewohnheiten', '2/5', 'heute'), feld('Aufbauen', gewohnheiten, { aktion: ico('plus', 'Neue Gewohnheit') })]],
    ['v-b', 'B · Kapseln', 'Alles rund wie Kapseln (26 px), 16 px Luft. Jedes Feld hat eine Kopfleiste; die wichtigste Aktion des Felds ist der dunkle Kreis am Ende dieser Leiste. Eingabe + „Hinzufügen“ als eine geteilte Kapsel.',
      () => [kopf('To-dos', 3, 'offen'), segmente, eingabe(`<button class="leiste__knopf leiste__knopf--breit">Hinzufügen</button>`), feld('Heute', zeilen(['Physio-Skript lesen', 'Einkaufen']), { aktion: ico('plus', 'Neu für heute') }), feld('Morgen', zeilen(['Steuer abgeben']), { aktion: ico('plus', 'Neu für morgen') })],
      () => [kopf('Gewohnheiten', '2/5', 'heute'), feld('Aufbauen', gewohnheiten, { aktion: ico('plus', 'Neue Gewohnheit') })]],
    ['v-c', 'C · Flach mit Fuß-Aktion', 'Ruhige, flache Flächen mit Akzent-Kante links, viel Luft (32 px) zwischen den Feldern, kleine Rundungen. Die Hauptaktion verschmilzt als dunkler Balken mit der Unterkante des Felds.',
      () => [kopf('To-dos', 3, 'offen'), segmente, feld('Heute', zeilen(['Physio-Skript lesen', 'Einkaufen']) + eingabe(''), { fuss: `${s('plus')} To-do hinzufügen` }), feld('Morgen', zeilen(['Steuer abgeben']))],
      () => [kopf('Gewohnheiten', '2/5', 'heute'), feld('Aufbauen', gewohnheiten, { fuss: `${s('plus')} Neue Gewohnheit` })]],
  ];
  document.getElementById('m').innerHTML = VARIANTEN.map(([k, t, txt, ...seiten]) =>
    `<section><h2>${t}</h2><p>${txt}</p><div class="reihe ${k}">${seiten.map((f) => `<div class="tel">${f().join('')}</div>`).join('')}</div></section>`).join('');
</script>
</body>
</html>
